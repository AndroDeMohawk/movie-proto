syntax = "proto3";

package movie;

option go_package = "github.com/AndroDeMohawk/movie-proto/gen/go/movie;moviev1";

service CommentService {
  rpc CreateComment (CreateCommentRequest) returns (CreateCommentResponse);
  rpc DeleteComment (DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListMovieComments (ListMovieCommentsRequest) returns (ListMovieCommentsResponse);
}


message Comment {
  int64 id = 1;
  int64 movie_id = 2;
  int64 user_id = 3;
  string text = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message CreateCommentRequest {
  int64 movie_id = 1;
  string text = 2;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message DeleteCommentRequest {
  int64 comment_id = 1;
}

message DeleteCommentResponse {
  bool success = 1;
}

message ListMovieCommentsRequest {
  int64 movie_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListMovieCommentsResponse {
  repeated Comment comments = 1;
}